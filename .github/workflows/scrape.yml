name: Refresh giveaways

on:
  schedule:
    # Twice daily, 06:00 and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Exits non-zero on a partial crawl and leaves giveaways.json untouched,
      # so a bad run fails loudly instead of publishing a truncated board.
      - name: Scrape Goodreads
        run: python scripts/scrape.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/giveaways.json data/snapshots
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          count=$(python -c "import json;print(len(json.load(open('public/giveaways.json'))['giveaways']))")
          git commit -m "data: refresh giveaways (${count} rows)"
          git push
